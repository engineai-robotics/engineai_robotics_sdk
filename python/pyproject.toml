[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "engineai-sdkpy"
version = "1.0.0"
description = "EngineAI RobotSession Python SDK"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engineai_sdkpy = ["py.typed", "*.pyi"]
